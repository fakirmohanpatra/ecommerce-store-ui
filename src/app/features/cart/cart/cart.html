<div class="cart">
  <h1>Shopping Cart</h1>
  <div *ngIf="cart && cart.items.length > 0; else emptyCart">
    <table mat-table [dataSource]="cart.items" class="mat-elevation-z8">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Product</th>
        <td mat-cell *matCellDef="let item">{{ item.name }}</td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef>Quantity</th>
        <td mat-cell *matCellDef="let item">
          <mat-form-field>
            <input matInput type="number" [value]="item.quantity" (input)="updateQuantity(item, +$event.target.value)" min="1">
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="pricePerUnit">
        <th mat-header-cell *matHeaderCellDef>Price per Unit</th>
        <td mat-cell *matCellDef="let item">${{ item.pricePerUnit.toFixed(2) }}</td>
      </ng-container>

      <ng-container matColumnDef="subtotal">
        <th mat-header-cell *matHeaderCellDef>Subtotal</th>
        <td mat-cell *matCellDef="let item">${{ item.subtotal.toFixed(2) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let item">
          <button mat-icon-button color="warn" (click)="removeItem(item)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div class="cart-summary">
      <p>Total Items: {{ cart.totalItems }}</p>
      <p>Total Amount: ${{ cart.totalAmount.toFixed(2) }}</p>
      <button mat-raised-button color="primary">Proceed to Checkout</button>
      <button mat-button (click)="clearCart()">Clear Cart</button>
    </div>
  </div>

  <ng-template #emptyCart>
    <p>Your cart is empty.</p>
  </ng-template>
</div>
